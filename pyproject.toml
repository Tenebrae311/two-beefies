[project]
name = "two-beefies"
version = "0.1.0"
description = "Britannica vs. Wikipedia: Hermes agent + debating agents on Nemotron"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=3.0,<5",
    "fastapi>=0.133.1",
    "hermes-agent",
    "lancedb>=0.40.0",
    "pandas>=3.0.6",
    "pillow>=10.0",
    "pyarrow>=26.0.0",
    "pytesseract>=0.3.10",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.41.0",
]

[tool.uv.workspace]
members = [
    "vendor/hermes-agent",
]

[tool.uv.sources]
hermes-agent = { workspace = true, editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["two_beefies"]
